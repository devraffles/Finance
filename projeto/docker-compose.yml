name: kwak-finance

services:
  db:
    image: postgres:16-alpine
    container_name: kwak_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwak_finance
      POSTGRES_PASSWORD: kwakfinancepass
      POSTGRES_DB: kwak_finance
    ports:
      - "5433:5432"
    volumes:
      - kwak_finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwak_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kwak_finance_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CI: "true"
      DATABASE_URL: postgresql://kwak_finance:kwakfinancepass@db:5432/kwak_finance
    ports:
      - "3000:3000"
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @kwak-finance/backend exec prisma generate --schema prisma/schema.prisma &&
      pnpm exec prisma migrate deploy --schema backend/prisma/schema.prisma &&
      pnpm exec prisma db seed &&
      pnpm run dev"

volumes:
  kwak_finance_postgres_data:
