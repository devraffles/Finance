version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: projeto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: projeto
      POSTGRES_PASSWORD: projetopass
      POSTGRES_DB: projeto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: projeto_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "corepack enable &&
      pnpm exec prisma migrate deploy --schema backend/prisma/schema.prisma &&
      pnpm exec prisma db seed &&
      pnpm run dev"

volumes:
  postgres_data:
