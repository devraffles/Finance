name: kwak-finance

services:
  db:
    image: postgres:16-alpine
    container_name: kwak_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - kwak_finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kwak_finance_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - "3000:3000"
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @kwak-finance/backend exec prisma generate --schema prisma/schema.prisma &&
      pnpm exec prisma migrate deploy --schema backend/prisma/schema.prisma &&
      pnpm exec prisma db seed &&
      pnpm --dir frontend dev"

volumes:
  kwak_finance_postgres_data:

networks:
  default:
    name: kwak_finance_network
